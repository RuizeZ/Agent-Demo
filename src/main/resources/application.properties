spring.application.name=demo
qwen.apiKey=${DASHSCOPE_API_KEY:}
spring.datasource.url=jdbc:mysql://localhost:3306/ai_recruitment_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DATASOURCE_PASSWORD:}
mybatis.configuration.map-underscore-to-camel-case=true

server.port=8081

spring.ai.mcp.server.name=recruitment-mcp-server
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

spring.ai.mcp.server.annotation-scanner.enabled=true
